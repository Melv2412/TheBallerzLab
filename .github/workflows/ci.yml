# Vérifie à chaque push et pull request que le backend passe le lint et ses tests,
# et que le frontend passe le lint, ses tests et compile. Un échec apparaît en rouge sur GitHub.
name: CI

on:
  push:
    branches: [main, deploiement-vercel]
  pull_request:

jobs:
  backend:
    name: Tests backend (Django)
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer les tests
        run: python manage.py test tournois

  frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Compiler
        run: npm run build
