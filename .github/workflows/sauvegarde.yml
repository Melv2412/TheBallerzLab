# Sauvegarde chiffrée de la base Supabase, chaque lundi à 3 h UTC (et à la demande depuis l'onglet Actions).
# Le plan gratuit de Supabase n'a aucune sauvegarde : ce workflow en garde 90 jours dans les artefacts GitHub.
#
# Secrets à créer (Settings > Secrets and variables > Actions > Secrets) :
#   SUPABASE_DB_URL     : URL du « Session pooler » Supabase (port 5432), avec le mot de passe
#   BACKUP_PASSPHRASE   : phrase secrète longue qui chiffre la sauvegarde (à garder précieusement)
# Le dépôt est public : la sauvegarde n'est jamais publiée en clair.
# Restauration : voir la section « Sauvegardes » du README.
name: Sauvegarde de la base

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE requis"
            exit 1
          fi

      - name: Installer pg_dump 17 (doit être au moins de la version du serveur)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Exporter puis chiffrer
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          fichier="thelab-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges --format=custom --file="$fichier"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$fichier.gpg" "$fichier"
          rm "$fichier"
          ls -lh "$fichier.gpg"
          echo "FICHIER=$fichier.gpg" >> "$GITHUB_ENV"

      - name: Conserver la sauvegarde (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FICHIER }}
          path: ${{ env.FICHIER }}
          retention-days: 90
          if-no-files-found: error
